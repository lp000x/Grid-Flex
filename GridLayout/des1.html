<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Interface Básica</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: grid;
            grid-template: 2fr 1fr 4fr 1fr / 2fr 4fr 2fr;
            border: 5px solid blue;
            gap: 5px;
            width: 100vw;
            height: 100vh;
        }

        .caixa1{
            grid-area: 1 / 1 / 2 / 5;
            background-color: yellow;
            text-align: center;
            
        }

        .caixa2{
            grid-area: 2 / 1 / 3 / 5;
            background-color: yellow;
            text-align: center;
        }

        .caixa3{
            grid-area: 3 / 1 / 4 / 3;
            background-color: yellow;
            text-align: center;
        }

        .caixa4{
            grid-area: 3 / 3 / 4 / 5;
            background-color: yellow;
            text-align: center;
        }

        .caixa5{
            grid-area: 4/ 1 / 5 / 5;
            background-color: yellow;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <main class="container">
        <div class="caixa1">topo</div>
        <div class="caixa2">menu</div>
        <div class="caixa3">principal</div>
        <div class="caixa4">secundario</div>
        <div class="caixa5">rodapé</div>
    </main>
</body>
</html>
